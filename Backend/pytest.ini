# pytest.ini
[pytest]
# Show descriptive test output using testdox
addopts = --testdox --tb=short -ra 
# Make sure Python warnings are visible (optional, helps debugging)
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::UserWarning

# Optional: set a minimum pytest version
minversion = 7.0

# Optional: mark known test categories (you can add more later)
markers =
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    slow: marks tests as slow (deselect with '-m "not slow"')


    
